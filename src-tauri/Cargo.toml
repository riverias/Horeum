[package]
name = "horeum"
version = "1.1.0"
description = "Horeum — музыкальный плеер"
authors = ["riverias"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "horeum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "gzip",
  "brotli",
  "stream",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
once_cell = "1"
parking_lot = "0.12"
rand = "0.8"
chrono = "0.4"
thiserror = "1"
urlencoding = "2"
futures = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
